<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="teaAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E58E26"/>
      <stop offset="50%" stop-color="#B71540"/>
      <stop offset="100%" stop-color="#6F1E51"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>
  <!-- Wooden Coaster -->
  <ellipse cx="200" cy="240" rx="110" ry="30" fill="#2B1810" stroke="#3D2318" stroke-width="6"/>
  
  <!-- Traditional Glass -->
  <path d="M 130 90 L 145 230 C 145 240, 255 240, 255 230 L 270 90 Z" fill="url(#glass)" stroke="#D4952A" stroke-width="4"/>
  
  <!-- Tea Liquid -->
  <path d="M 135 110 L 147 225 C 147 232, 253 232, 253 225 L 265 110 Z" fill="url(#teaAmber)"/>
  
  <!-- Foam & Mint Leaves -->
  <ellipse cx="200" cy="110" rx="65" ry="12" fill="#F5EBD8" opacity="0.9"/>
  <!-- Fresh Mint Leaf -->
  <path d="M 190 105 Q 160 80 180 60 Q 210 80 190 105 Z" fill="#3D5C42" stroke="#223B26" stroke-width="2"/>
  <path d="M 205 108 Q 235 85 220 65 Q 195 85 205 108 Z" fill="#4E7854"/>
  
  <!-- Cinnamon Stick -->
  <rect x="230" y="50" width="14" height="110" rx="7" fill="#8C500C" transform="rotate(20 230 50)"/>
  
  <!-- Moroccan Pattern Etching on Glass -->
  <path d="M 150 140 Q 200 160 250 140" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <path d="M 152 170 Q 200 190 248 170" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
</svg>
